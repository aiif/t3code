name: Fork release

# Fork-only release train: one tag push publishes:
#
# - T3-Code-<version>-x64.exe, the Windows x64 NSIS installer.
# - T3-Code-<version>-android-arm64.apk, the native React Native app from
#   apps/mobile, built for arm64-v8a (current flagship Android phones).
#
# Linux and iOS artifacts are not published. Linux x64 is built internally
# because the Windows installer embeds its CLI archive as the WSL runtime; that
# artifact never reaches the GitHub Release. The Android APK is self-use only:
# it is signed with the template debug key, never a production keystore.
#
# Both clients are built in personal mode (GOAL.md): T3 Connect is off, copied
# links point at the personal portal, and the Android app gets the personal
# network setup (relay URL + key, host discovery) instead of a PWA wrapper.
#
# The upstream release.yml is inert on forks (its resolve_commit job requires
# pingdotgg/t3code), so this workflow intentionally owns the tag trigger.
# Setup and optional signing secrets: docs/operations/fork-release.md.

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-nightly.*"
      - "!v*-preview.*"
  workflow_dispatch:

concurrency:
  group: fork-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - id: meta
        name: Resolve version from tag
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $tag does not contain a semver version."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release: \`$tag\` (\`$version\`)" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          fi

  bundle:
    name: Build JS bundle
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Personal mode only: hide T3 Connect and point copied links at the
      # portal. This is the same web bundle the desktop app serves. The desktop
      # main process bakes T3CODE_PERSONAL_ONLY into the tray/close behavior.
      VITE_T3CODE_PERSONAL_ONLY: "1"
      T3CODE_PERSONAL_ONLY: "1"
      # Set T3CODE_PERSONAL_PORTAL_URL to your relay origin. Unset leaves every
      # relay field blank for the user to fill in.
      VITE_HOSTED_APP_URL: ${{ vars.T3CODE_PERSONAL_PORTAL_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.prepare.outputs.version }}"

      - name: Build JS bundle
        run: vp run build:desktop:bundle

      - name: Upload JS bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  # Only exists to hand the Windows job its WSL runtime. The archive is built
  # and uploaded before the Linux desktop artifact, so the Windows wait below
  # does not depend on AppImage packaging finishing. Nothing from this job is
  # attached to the release.
  desktop_linux_x64:
    name: Desktop Linux x64
    needs: [prepare, bundle]
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: stable
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true
      launch_check: false
      relay_client_tracing: false
      timeout_minutes: 90

  desktop_win_x64:
    name: Desktop Windows x64
    needs: [prepare, bundle]
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: stable
      label: Windows x64
      runner: ubuntu-24.04
      verify_runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      # The Linux job's CLI archive, embedded as the WSL runtime, is the archive
      # this job needs. A Windows CLI archive is not part of a fork release.
      cli_archive: false
      relay_client_tracing: false
      # Shares the Linux job's install args, so let that job reserve the store.
      save_pnpm_store: false
      timeout_minutes: 150

  android_arm64:
    name: Android arm64 APK
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      APP_VARIANT: production
      CI: "1"
      EXPO_NO_GIT_STATUS: "1"
      EXPO_NO_TELEMETRY: "1"
      NODE_OPTIONS: --max-old-space-size=8192
      T3CODE_MOBILE_VERSION: ${{ needs.prepare.outputs.version }}
      # This fork has no EAS project of its own to publish OTAs to.
      T3CODE_MOBILE_UPDATES_ENABLED: "0"
      # Personal mode: the app shows the personal network setup and hides the
      # T3 Connect surfaces. No Clerk or relay configuration is baked in.
      T3CODE_PERSONAL_ONLY: "1"
      T3CODE_PERSONAL_RELAY_URL: ${{ vars.T3CODE_PERSONAL_PORTAL_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/mobile...

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Prebuild Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --clean --platform android --no-install

      - name: Align Android version with the tag
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          code="$(VERSION="$VERSION" node -e '
            const match = /^(\d+)\.(\d+)\.(\d+)/.exec(process.env.VERSION);
            if (!match) process.exit(1);
            const [, major, minor, patch] = match;
            process.stdout.write(String(Number(major) * 1000000 + Number(minor) * 1000 + Number(patch)));
          ')"
          if (( code < 1 || code > 2100000000 )); then
            echo "::error::Version $VERSION produces an invalid Android versionCode ($code)."
            exit 1
          fi
          VERSION_CODE="$code" node -e '
            const fs = require("node:fs");
            const path = "apps/mobile/android/app/build.gradle";
            const text = fs.readFileSync(path, "utf8");
            const next = text.replace(/versionCode \d+/, `versionCode ${process.env.VERSION_CODE}`);
            if (next === text) throw new Error("versionCode not found in app/build.gradle");
            fs.writeFileSync(path, next);
          '
          grep -Fq "versionName \"$VERSION\"" apps/mobile/android/app/build.gradle || {
            echo "::error::Expected versionName $VERSION in the generated Android project."
            exit 1
          }

      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # Key on inputs, not the generated project: its versionName changes
          # every release and would invalidate a useful dependency cache.
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/package.json', 'apps/mobile/app.config.ts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build release APK
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -x lintVitalAnalyzeRelease \
            -x lintVitalRelease \
            --no-daemon \
            --stacktrace

      # A release keystore must stay stable across releases or Android refuses
      # to update an installed app. This fork is self-use: the Gradle release
      # build uses the template debug/local key, which is stable and public.
      # Never add a production keystore or signing secrets here.
      - name: Collect APK
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          apk="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          mkdir -p release-android
          out="release-android/T3-Code-${VERSION}-android-arm64.apk"
          cp "$apk" "$out"
          echo "Android APK: signed with the template debug/local key (self-use sideload)." >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$out" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-arm64-apk
          path: release-android/*.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: [prepare, desktop_win_x64, android_arm64]
    if: always() && needs.prepare.result == 'success' && needs.desktop_win_x64.result == 'success' && needs.android_arm64.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      # Generated release notes read pull requests and their authors.
      pull-requests: read
    steps:
      # Gives `gh` a repository context and the tag; assets come from artifacts.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Download Windows artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-win-x64
          path: release-assets

      - name: Download Android artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-arm64-apk
          path: release-assets

      # The packaging job suffixes its updater manifest with the arch so a
      # multi-arch release cannot overwrite it. This fork ships one Windows
      # architecture, and electron-updater reads the unsuffixed name.
      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          rm -f release-assets/builder-debug.yml
          if [[ -f release-assets/latest-win-x64.yml ]]; then
            mv release-assets/latest-win-x64.yml release-assets/latest.yml
          fi
          patterns=("T3-Code-*-x64.exe" "T3-Code-*-android-arm64.apk" "latest.yml")

          for pattern in "${patterns[@]}"; do
            compgen -G "release-assets/$pattern" >/dev/null || {
              echo "::error::Missing expected release asset: $pattern"
              exit 1
            }
          done

          # No Linux, iOS, or source archive is attached. GitHub still shows its
          # auto-generated source links for every release; that cannot be
          # disabled through the API.
          cd release-assets
          shopt -s nullglob
          artifacts=(*.exe *.apk)
          sha256sum "${artifacts[@]}" > SHA256SUMS
          cat SHA256SUMS

      # The release stays a draft until every asset is attached, so an updater
      # never sees a version whose installer or manifest is still missing.
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Hide an already-published release while its assets are replaced,
            # so an updater cannot read a new manifest beside an old installer.
            gh release edit "$TAG" --draft
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "T3 Code v$VERSION" \
              --generate-notes \
              --draft
          fi
          gh release upload "$TAG" release-assets/* --clobber
          if [[ "$PRERELEASE" == "true" ]]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi
          gh release view "$TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY" || true
