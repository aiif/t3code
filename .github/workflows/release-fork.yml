name: Fork release

# Fork-only release train: one tag push produces a Windows x64 installer, an
# Intel macOS DMG, and a sideloadable Android APK. The upstream release.yml is
# inert on forks (its resolve_commit job requires pingdotgg/t3code), so this
# workflow intentionally owns the tag trigger.
#
# Packaging reuses release-desktop.yml, which is the source of truth for the
# Electron artifact. Linux x64 is built only because the Windows installer
# embeds that job's CLI archive as its WSL runtime; the Linux artifacts are not
# attached to the release.
#
# Setup and optional signing secrets: docs/operations/fork-release.md.

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-nightly.*"
      - "!v*-preview.*"

concurrency:
  group: fork-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      clerk_publishable_key: ${{ steps.cloud.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ steps.cloud.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ steps.cloud.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ steps.cloud.outputs.relay_url }}
    steps:
      - id: meta
        name: Resolve version from tag
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $tag does not contain a semver version."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release: \`$tag\` (\`$version\`)" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      # T3 Connect is off by default: a fork should not send users' auth and
      # relay traffic to someone else's deployment without an explicit choice.
      # Set all four repository variables to the public values in .env.example
      # (or to your own deployment) to turn it back on.
      - id: cloud
        name: Resolve T3 Connect public config
        env:
          RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
          CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
          CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [[ -n "$RELAY_URL" && -n "$CLERK_PUBLISHABLE_KEY" && -n "$CLERK_JWT_TEMPLATE" && -n "$CLERK_CLI_OAUTH_CLIENT_ID" ]]; then
            {
              echo "relay_url=$RELAY_URL"
              echo "clerk_publishable_key=$CLERK_PUBLISHABLE_KEY"
              echo "clerk_jwt_template=$CLERK_JWT_TEMPLATE"
              echo "clerk_cli_oauth_client_id=$CLERK_CLI_OAUTH_CLIENT_ID"
            } >> "$GITHUB_OUTPUT"
            echo "T3 Connect: enabled from repository variables." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "relay_url="
              echo "clerk_publishable_key="
              echo "clerk_jwt_template="
              echo "clerk_cli_oauth_client_id="
            } >> "$GITHUB_OUTPUT"
            echo "T3 Connect: disabled. Set all four T3CODE_* repository variables to enable it." >> "$GITHUB_STEP_SUMMARY"
          fi

  bundle:
    name: Build JS bundle
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ needs.prepare.outputs.clerk_publishable_key }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ needs.prepare.outputs.clerk_jwt_template }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ needs.prepare.outputs.clerk_cli_oauth_client_id }}
      T3CODE_RELAY_URL: ${{ needs.prepare.outputs.relay_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.prepare.outputs.version }}"

      - name: Build JS bundle
        run: vp run build:desktop:bundle

      - name: Upload JS bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  desktop_mac_x64:
    name: Desktop macOS x64
    needs: [prepare, bundle]
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: stable
      clerk_publishable_key: ${{ needs.prepare.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.prepare.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.prepare.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.prepare.outputs.relay_url }}
      label: macOS x64
      runner: macos-15-intel
      platform: mac
      target: dmg
      arch: x64
      rust_target: x86_64-apple-darwin
      resource_key: darwin-x64
      # Node single-executables are unsupported on x64 macOS; the Electron app
      # itself is unaffected.
      cli_archive: false
      launch_check: true
      relay_client_tracing: false
      timeout_minutes: 75

  # Only exists to hand the Windows job its WSL runtime. The archive is built
  # and uploaded before the Linux desktop artifact, so the Windows wait below
  # does not depend on AppImage packaging finishing.
  desktop_linux_x64:
    name: Desktop Linux x64
    needs: [prepare, bundle]
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: stable
      clerk_publishable_key: ${{ needs.prepare.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.prepare.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.prepare.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.prepare.outputs.relay_url }}
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true
      launch_check: false
      relay_client_tracing: false
      timeout_minutes: 90

  desktop_win_x64:
    name: Desktop Windows x64
    needs: [prepare, bundle]
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: stable
      clerk_publishable_key: ${{ needs.prepare.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.prepare.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.prepare.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.prepare.outputs.relay_url }}
      label: Windows x64
      runner: ubuntu-24.04
      verify_runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      # The Linux job's CLI archive, embedded as the WSL runtime, is the archive
      # this job needs. A Windows CLI archive is not part of a fork release.
      cli_archive: false
      relay_client_tracing: false
      # Shares the Linux job's install args, so let that job reserve the store.
      save_pnpm_store: false
      timeout_minutes: 150

  android:
    name: Android APK
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      APP_VARIANT: production
      CI: "1"
      EXPO_NO_GIT_STATUS: "1"
      EXPO_NO_TELEMETRY: "1"
      NODE_OPTIONS: --max-old-space-size=8192
      T3CODE_MOBILE_VERSION: ${{ needs.prepare.outputs.version }}
      # This fork has no EAS project of its own to publish OTAs to.
      T3CODE_MOBILE_UPDATES_ENABLED: "0"
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ needs.prepare.outputs.clerk_publishable_key }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ needs.prepare.outputs.clerk_jwt_template }}
      T3CODE_RELAY_URL: ${{ needs.prepare.outputs.relay_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/mobile...

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Prebuild Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --clean --platform android --no-install

      - name: Align Android version with the tag
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          code="$(VERSION="$VERSION" node -e '
            const match = /^(\d+)\.(\d+)\.(\d+)/.exec(process.env.VERSION);
            if (!match) process.exit(1);
            const [, major, minor, patch] = match;
            process.stdout.write(String(Number(major) * 1000000 + Number(minor) * 1000 + Number(patch)));
          ')"
          if (( code < 1 || code > 2100000000 )); then
            echo "::error::Version $VERSION produces an invalid Android versionCode ($code)."
            exit 1
          fi
          VERSION_CODE="$code" node -e '
            const fs = require("node:fs");
            const path = "apps/mobile/android/app/build.gradle";
            const text = fs.readFileSync(path, "utf8");
            const next = text.replace(/versionCode \d+/, `versionCode ${process.env.VERSION_CODE}`);
            if (next === text) throw new Error("versionCode not found in app/build.gradle");
            fs.writeFileSync(path, next);
          '
          grep -Fq "versionName \"$VERSION\"" apps/mobile/android/app/build.gradle || {
            echo "::error::Expected versionName $VERSION in the generated Android project."
            exit 1
          }

      # Two-ABI native builds are large; drop toolchains this job never uses.
      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # Key on inputs, not the generated project: its versionName changes
          # every release and would invalidate a useful dependency cache.
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/package.json', 'apps/mobile/app.config.ts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build release APK
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            -x lintVitalAnalyzeRelease \
            -x lintVitalRelease \
            --no-daemon \
            --stacktrace

      # A release keystore must stay stable across releases or Android refuses
      # to update an installed app. Without one, Gradle's release build uses
      # the template debug key, which is stable but public.
      - name: Sign APK
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          apk="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          mkdir -p release-android
          out="release-android/T3-Code-${VERSION}-android.apk"

          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
              if [[ -z "${!name:-}" ]]; then
                echo "::error::$name is required when ANDROID_KEYSTORE_BASE64 is set."
                exit 1
              fi
            done
            sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
            if [[ -z "$sdk" ]]; then
              echo "::error::ANDROID_HOME is not set."
              exit 1
            fi
            build_tools="$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            "$build_tools/zipalign" -f -p 4 "$apk" "$RUNNER_TEMP/aligned.apk"
            "$build_tools/apksigner" sign \
              --ks "$RUNNER_TEMP/release.keystore" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass "env:ANDROID_KEYSTORE_PASSWORD" \
              --key-pass "env:ANDROID_KEY_PASSWORD" \
              --out "$out" \
              "$RUNNER_TEMP/aligned.apk"
            "$build_tools/apksigner" verify --print-certs "$out"
            echo "Android APK: signed with ANDROID_KEYSTORE_BASE64." >> "$GITHUB_STEP_SUMMARY"
          else
            cp "$apk" "$out"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK uses the template debug key."
            echo "Android APK: no release keystore configured, using the template debug key." >> "$GITHUB_STEP_SUMMARY"
          fi

          sha256sum "$out" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: release-android/*.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: [prepare, desktop_mac_x64, desktop_win_x64, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      # Generated release notes read pull requests and their authors.
      pull-requests: read
    steps:
      # Gives `gh` a repository context and the tag; assets come from artifacts.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      # Download by exact name: a `desktop-*` pattern would also pull in the
      # Linux artifact this workflow builds only for the Windows WSL runtime.
      - name: Download macOS artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-mac-x64
          path: release-assets

      - name: Download Windows artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-win-x64
          path: release-assets

      - name: Download Android APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apk
          path: release-assets

      # The packaging jobs suffix per-arch updater manifests so the two
      # architectures of a full release cannot overwrite each other. This fork
      # ships one architecture per platform, and electron-updater reads the
      # unsuffixed names.
      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          rm -f release-assets/builder-debug.yml
          if [[ -f release-assets/latest-mac-x64.yml ]]; then
            mv release-assets/latest-mac-x64.yml release-assets/latest-mac.yml
          fi
          if [[ -f release-assets/latest-win-x64.yml ]]; then
            mv release-assets/latest-win-x64.yml release-assets/latest.yml
          fi

          for pattern in "*.exe" "*.dmg" "*.zip" "*.apk" "latest.yml" "latest-mac.yml"; do
            compgen -G "release-assets/$pattern" >/dev/null || {
              echo "::error::Missing expected release asset: $pattern"
              exit 1
            }
          done

          cd release-assets
          shopt -s nullglob
          artifacts=(*.dmg *.zip *.exe *.apk)
          sha256sum "${artifacts[@]}" > SHA256SUMS
          cat SHA256SUMS

      # The release stays a draft until every asset is attached, so an updater
      # never sees a version whose installer or manifest is still missing.
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Hide an already-published release while its assets are replaced,
            # so an updater cannot read a new manifest beside an old installer.
            gh release edit "$TAG" --draft
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "T3 Code v$VERSION" \
              --generate-notes \
              --draft
          fi
          gh release upload "$TAG" release-assets/* --clobber
          if [[ "$PRERELEASE" == "true" ]]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi
          gh release view "$TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY" || true
