name: Publish t3relay VPS relay

# Publishing is explicit: a vps-relay-v* tag or a manual main-branch dispatch.
# A normal merge never triggers this workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example 0.1.0 (required for a manual run)"
        required: true
        type: string
  push:
    tags:
      - "vps-relay-v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-t3relay
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish @aiif/t3relay
    if: (github.repository == 'aiif/t3code' || vars.T3RELAY_NPM_PUBLISH_ENABLED == '1') && (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment:
      name: npm
    env:
      T3RELAY_PACKAGE_NAME: ${{ vars.T3RELAY_NPM_PACKAGE_NAME || '@aiif/t3relay' }}
      T3RELAY_CREATE_PACKAGE_NAME: ${{ vars.T3RELAY_NPM_CREATE_PACKAGE_NAME || '@aiif/create-t3relay' }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true

      - name: Resolve the version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" && "$TAG_NAME" == vps-relay-v* ]]; then
            version="${TAG_NAME#vps-relay-v}"
          else
            version="${DISPATCH_VERSION:-}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::A manual publish needs a version like 0.1.0, or push a vps-relay-v0.1.0 tag."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $T3RELAY_PACKAGE_NAME@$version"

      - name: Refuse to overwrite a published version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if npm view "${T3RELAY_PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "::error::${T3RELAY_PACKAGE_NAME}@${VERSION} already exists on npm."
            exit 1
          fi

      - name: Build the packages and native bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node infra/personal-relay/scripts/build-npm-package.mjs \
            --version "$VERSION" \
            --package-name "$T3RELAY_PACKAGE_NAME" \
            --create-package-name "$T3RELAY_CREATE_PACKAGE_NAME"

      - name: Configure npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NPM_TOKEN:-}" ]]; then
            echo "::error::The npm environment needs an NPM_TOKEN secret with publish rights for ${T3RELAY_PACKAGE_NAME}."
            exit 1
          fi
          npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"

      - name: Publish the main package
        working-directory: infra/personal-relay/dist/npm
        run: npm publish --provenance --access public

      - name: Publish the create wrapper
        working-directory: infra/personal-relay/dist/create
        run: npm publish --provenance --access public

      - name: Create or update the GitHub release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="vps-relay-v${VERSION}"
          assets=(
            "infra/personal-relay/dist/native/t3relay-native-${VERSION}.tar.gz"
            "infra/personal-relay/dist/native/SHA256SUMS"
          )
          title="T3 Code personal relay v${VERSION}"
          notes="$(cat <<EOF
          Personal-network relay ${VERSION}.

          Docker one-command: npx ${T3RELAY_PACKAGE_NAME}@latest init
          AI-native no-Docker: npx ${T3RELAY_PACKAGE_NAME}@latest prompt
          Native bundle: t3relay-native-${VERSION}.tar.gz

          See docs/operations/personal-relay.md in the repository.
          EOF
          )"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --title "$title" \
              --notes "$notes" \
              --target "$GITHUB_SHA"
          fi

      - name: Record the tarball sizes
        shell: bash
        run: |
          set -euo pipefail
          cat infra/personal-relay/dist/npm-pack-report.json
          {
            echo "### t3relay packages"
            echo
            echo '```json'
            cat infra/personal-relay/dist/npm-pack-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
