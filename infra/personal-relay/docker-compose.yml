name: t3-personal-relay

services:
  frps:
    image: fatedier/frps:v0.61.1
    restart: unless-stopped
    volumes:
      - ./frps.toml:/etc/frp/frps.toml:ro
    ports:
      # 7001 is the only new public port.
      - "7001:7001"
      # OpenResty reaches the vhost port over loopback.
      - "127.0.0.1:8080:8080"

  registry:
    build: ./registry
    restart: unless-stopped
    depends_on:
      - frps
    env_file:
      - .env
    environment:
      REGISTRY_HOST: 0.0.0.0
      REGISTRY_PORT: 8787
      REGISTRY_DATA_DIR: /data
    volumes:
      - registry-data:/data
    ports:
      # OpenResty proxies https://<portal>/v1/* here; never expose 8787 publicly.
      - "127.0.0.1:8787:8787"

volumes:
  registry-data:
